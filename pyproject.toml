# akasa/pyproject.toml
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "akasa"
version = "0.1.0"
description = "Agnostic Volume Router and Event Bus Substrate."
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "cryptography>=41.0.0"
]
[tool.setuptools.packages.find]
where = ["."]
include = ["akasa", "akasa.*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]